spring:
  application:
    name: groundedia-hr-leave

  # En développement, l'application lit le même fichier .env que docker-compose (optionnel, à la racine du dépôt).
  # Les variables d'environnement, si elles sont définies, gardent la priorité. En production, pas de fichier .env.
  config:
    import: optional:file:./.env[.properties]

  # Mêmes variables et mêmes valeurs par défaut que docker-compose.yml.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:groundedia}
    username: ${POSTGRES_USER:groundedia}
    password: ${POSTGRES_PASSWORD:groundedia}

  # Le schéma est géré exclusivement par Flyway : migrations du socle (core) et du cas d'usage (hr-leave),
  # ordonnées par leur horodatage. Un emplacement introuvable (jar de core absent) fait échouer le démarrage.
  flyway:
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/hr-leave
    fail-on-missing-locations: true

  # Appels HTTP sortants (Ollama) : un lot d'embeddings peut prendre des dizaines de secondes sur un processeur.
  http:
    client:
      read-timeout: 10m

# Modèles locaux via Ollama : gratuits, hors ligne, les documents ne quittent pas le poste.
# bge-m3 : embeddings de 1024 dimensions (= colonne chunk.embedding), multilingue, ≈ 1,2 Go en mémoire.
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding-model: bge-m3

# Génération : llm.provider = local (Ollama sur le poste) | api (API distante compatible OpenAI). C'est la seule
# ligne qui change entre les deux ; le reste du code ne connaît que l'interface LlmClient.
# La clé de l'API distante est lue dans la variable d'environnement LLM_API_KEY, jamais dans un fichier versionné.
# Modèle local : qwen2.5:7b (4,7 Go, ≈ 2 min par question sur processeur) applique les règles à la situation du
# salarié ; qwen2.5:3b (1,9 Go, ≈ 1 min) suffit pour les questions sans salarié mais se trompe dans les calculs.
llm:
  provider: local
  local:
    model: qwen2.5:7b
  api:
    base-url: https://api.mistral.ai/v1
    model: mistral-small-latest

# Réponse : nombre de morceaux fournis au LLM ; garde-fou avant le LLM : la question est couverte si la similarité
# cosinus du meilleur morceau atteint seuil-similarite OU si sa densité lexicale atteint seuil-lexical (ou si elle
# cite un article présent). Mesuré sur bge-m3 avec 31 questions : hors sujet ≤ 0,547 et ≤ 0,333, couvertes ≥ 0,618
# ou ≥ 0,444. À remesurer si le modèle d'embedding ou le corpus change. source-documents : libellé du bloc des extraits.
reponse:
  morceaux: 5
  seuil-similarite: 0.58
  seuil-lexical: 0.40
  source-documents: convention collective et Code du travail

# Recherche : vector | fulltext | hybrid (fusion RRF des deux classements). Le mode peut être forcé par
# le paramètre mode= de GET /search. limit : résultats renvoyés. En hybride, profondeur de chaque classement
# fusionné : la liste vectorielle reste pertinente en profondeur, la liste plein texte en « ou » ne l'est qu'en tête
# (valeurs calibrées sur les dix questions du test comparatif, voir README).
search:
  mode: hybrid
  limit: 5
  candidats-vectoriels: 20
  candidats-plein-texte: 5

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8081